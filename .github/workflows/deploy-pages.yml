name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages is static-only. Strip everything that needs a server
      # runtime so `next build` can do a clean static export of the public site.
      # /p/[slug] (admin-created custom pages) and /welcome/[track] (admin-managed
      # post-payment pages) live in Vercel Blob — they have no content at build
      # time on the static mirror, render dynamically (force-dynamic), and Next's
      # `output: export` cannot emit dynamic routes. The welcome pages are only
      # reached via the Razorpay redirect to the live Vercel site anyway.
      - name: Strip server-only routes
        run: |
          rm -rf src/app/admin
          rm -rf src/app/api
          rm -rf src/app/p
          rm -rf src/app/welcome
          rm -f src/middleware.ts
          rm -f src/app/icon.tsx
          rm -f src/app/opengraph-image.tsx
          # Public pages are `force-dynamic` on the Vercel (server) build so admin
          # edits show instantly. `output: export` can't emit dynamic routes, so
          # strip that directive here — the static mirror is a build-time snapshot
          # of the committed content anyway. (sed is a no-op on files without it.)
          find src/app -name page.tsx -exec sed -i "/export const dynamic = 'force-dynamic';/d" {} +

      - name: Build static export
        env:
          GH_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/furor-web'
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
