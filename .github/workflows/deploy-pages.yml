name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages is static-only. Strip everything that needs a server
      # runtime so `next build` can do a clean static export of the public site.
      # /p/[slug] (admin-created custom pages) and /welcome/[track] (admin-managed
      # post-payment pages) live in the R2 content store — they have no content at
      # build time on the static mirror, render dynamically (force-dynamic), and
      # Next's `output: export` cannot emit dynamic routes. The welcome pages are
      # only reached via the Razorpay redirect to the live Cloudflare site anyway.
      - name: Strip server-only routes
        run: |
          rm -rf src/app/admin
          rm -rf src/app/api
          rm -rf src/app/p
          rm -rf src/app/welcome
          rm -rf src/app/uploads
          rm -f src/middleware.ts
          # `output: export` requires force-static on the sitemap route; on
          # Workers the same file must stay dynamic, so it's appended here.
          printf "\nexport const dynamic = 'force-static';\n" >> src/app/sitemap.ts

      - name: Build static export
        env:
          GH_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/furor-web'
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
