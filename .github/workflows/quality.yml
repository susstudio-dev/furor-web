name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The unit suite is a gate, not a suggestion — it carries the security
      # regressions (authorization, CAS, guard sweep) that typecheck and build
      # cannot see.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # NB: no lint step — the repo has no ESLint config installed and
      # `next lint` is interactive/deprecated. Typecheck + build is the gate.
      - name: Build (server)
        run: npm run build
