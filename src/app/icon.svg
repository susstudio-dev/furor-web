<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Furor — Dance Hyderabad</title>
  <style>
    /* The favicon lives in browser chrome, which follows the OS/browser theme —
       not the site's own light/dark toggle. So it keys off prefers-color-scheme. */
    .dark { display: none }
    @media (prefers-color-scheme: dark) {
      .light { display: none }
      .dark { display: inline }
    }
  </style>
  <image class="light" width="128" height="128" href="data:image/png;base64,"/>
  <image class="dark" width="128" height="128" href="data:image/png;base64,"/>
</svg>
